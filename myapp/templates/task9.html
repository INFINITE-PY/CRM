<!DOCTYPE html>
<html>
<head><title>Задача 9</title></head>
<body>
    <h2>9. Средняя зарплата преподавателей (aggregate)</h2>

    <h3>Добавить преподавателя:</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Добавить</button>
    </form>
    <br>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Показатель</th>
                <th>Значение</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Средняя зарплата</td>
                <td><strong>{{ avg_salary|floatformat:2|default:"0" }} руб.</strong></td>
            </tr>
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
