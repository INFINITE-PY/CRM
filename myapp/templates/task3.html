<!DOCTYPE html>
<html>
<head><title>Задача 3</title></head>
<body>
    <h2>3. Студенты и все их оценки (prefetch_related)</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Студент</th>
                <th>Все оценки</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>
                    {% for grade in student.grades.all %}
                        {{ grade.score }}{% if not forloop.last %}, {% endif %}
                    {% empty %}
                        Оценок нет
                    {% endfor %}
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Студентов нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
