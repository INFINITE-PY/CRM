<!DOCTYPE html>
<html>
<head><title>Задача 2</title></head>
<body>
    <h2>2. Оценки и студенты (select_related)</h2>

    <h3>Добавить оценку:</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Добавить оценку</button>
    </form>
    <br>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Студент</th>
                <th>Предмет</th>
                <th>Оценка</th>
            </tr>
        </thead>
        <tbody>
            {% for grade in grades %}
            <tr>
                <td>{{ grade.student.name }}</td>
                <td>{{ grade.subject.name }}</td>
                <td>{{ grade.score }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Оценок нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
