<!DOCTYPE html>
<html>
<head><title>Задача 5</title></head>
<body>
    <h2>5. Количество студентов в группе</h2>

    <h3>Добавить группу:</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Создать группу</button>
    </form>
    <br>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Группа</th>
                <th>Кол-во студентов</th>
            </tr>
        </thead>
        <tbody>
            {% for group in groups %}
            <tr>
                <td>{{ group.name }}</td>
                <td>{{ group.student_count }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Групп нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
