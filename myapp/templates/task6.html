<!DOCTYPE html>
<html>
<head><title>Задача 6</title></head>
<body>
    <h2>6. Средняя оценка каждого студента (annotate)</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Студент</th>
                <th>Средний балл</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.avg_score|floatformat:2|default:"0" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Студентов нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
