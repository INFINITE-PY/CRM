<!DOCTYPE html>
<html>
<head><title>Задача 7</title></head>
<body>
    <h2>7. Количество книг у каждого автора (annotate)</h2>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Автор</th>
                <th>Количество книг</th>
            </tr>
        </thead>
        <tbody>
            {% for author in authors %}
            <tr>
                <td>{{ author.name }}</td>
                <td>{{ author.book_count }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Авторов нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
