<!DOCTYPE html>
<html>
<head><title>Задача 1</title></head>
<body>
    <h2>1. Студенты и их группы</h2>

    <h3>Добавить студента:</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
    <br>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Имя студента</th>
                <th>Возраст</th>
                <th>Группа</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.group.name }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Данных нет</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <p><a href="{% url 'index' %}">← На главную</a></p>
</body>
</html>
